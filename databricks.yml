# Databricks Asset Bundles configuration
# https://docs.databricks.com/dev-tools/bundles/

bundle:
  name: data-platform

targets:
  dev:
    mode: development
    workspace:
      host: https://adb-955988584387839.19.azuredatabricks.net
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    resources:
      jobs:
        member_load:
          name: "[DEV] Member Load Job"
          job_clusters:
            - job_cluster_key: main
              new_cluster:
                spark_version: 14.3.x-scala2.12
                node_type_id: i3.xlarge
                num_workers: 2

          tasks:
            - task_key: member_pipeline
              job_cluster_key: main
              notebook_task:
                notebook_path: ../notebooks/orchestration/main.py
                base_parameters:
                  pipeline_name: member
                  environment: dev


  qa:
    mode: nonproduction
    workspace:
      host: https://adb-4147533694583605.5.azuredatabricks.net/?o=4147533694583605
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}

    resources:
      jobs:
        member_load:
          name: "[QA] Member Load Job"
          schedule:
            quartz_cron_expression: "0 0 2 * * ?"
            timezone_id: America/New_York

          email_notifications:
            on_failure:
              - data-engineering-qa@company.com

  prod:
    mode: production
    workspace:
      host: https://your-workspace.cloud.databricks.com
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}

    run_as:
      service_principal_name: data-platform-sp

    resources:
      jobs:
        member_load:
          name: "[PROD] Member Load Job"
          schedule:
            quartz_cron_expression: "0 0 2 * * ?"
            timezone_id: America/New_York
            pause_status: UNPAUSED

          email_notifications:
            on_failure:
              - data-engineering-prod@company.com
            on_success:
              - data-engineering-prod@company.com
